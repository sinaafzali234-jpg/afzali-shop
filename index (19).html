<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07080a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="افضلی‌شاپ">
<title>افضلی‌شاپ | Afzali Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#07080a; --bg2:#0d0f0b; --panel:#14170f; --panel2:#191c14;
  --gold:#d4af37; --gold-l:#f3d878; --gold-d:#a8842a;
  --green:#4a5d32; --green-l:#6b7f45; --green-d:#2c3a1c;
  --ink:#f5f1e6; --muted:#a7a493; --line:#2a2c22;
  --danger:#e05555; --radius:16px;
  --shadow-gold:0 0 30px rgba(212,175,55,.25);
  --font-body:'Vazirmatn',sans-serif; --font-heading:'Vazirmatn',sans-serif; --font-eng:'Cinzel',serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  background:radial-gradient(ellipse at top,#101208 0%,var(--bg) 55%);
  color:var(--ink); font-family:var(--font-body),sans-serif; overflow-x:hidden;
  min-height:100vh;
}
img{max-width:100%; display:block;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input,textarea,select{font-family:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:11px 14px; font-size:14px; outline:none; transition:.2s;}
input:focus,textarea:focus,select:focus{border-color:var(--gold);}
h1,h2,h3{font-family:var(--font-heading),sans-serif;}
.eng{font-family:var(--font-eng),serif; letter-spacing:1px;}
.wrap{max-width:1280px; margin:0 auto; padding:0 24px;}
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:var(--gold-d); border-radius:8px;}
::-webkit-scrollbar-track{background:var(--bg2);}

/* ---------- utility ---------- */
.btn{display:inline-flex; align-items:center; gap:8px; padding:13px 26px; border-radius:999px; font-weight:600; font-size:14.5px; transition:.25s; white-space:nowrap;}
.btn-gold{background:linear-gradient(135deg,var(--gold-l),var(--gold-d)); color:#1a1305; box-shadow:0 6px 20px rgba(212,175,55,.25);}
.btn-gold:hover{transform:translateY(-2px); box-shadow:0 10px 28px rgba(212,175,55,.4);}
.btn-outline{border:1px solid var(--gold); color:var(--gold-l);}
.btn-outline:hover{background:rgba(212,175,55,.1);}
.btn-green{background:linear-gradient(135deg,var(--green-l),var(--green-d)); color:#052e14; font-weight:700;}
.btn-green:hover{transform:translateY(-2px); box-shadow:0 10px 24px rgba(47,209,112,.3);}
.btn-danger{background:rgba(224,85,85,.15); color:#ff9d9d; border:1px solid rgba(224,85,85,.4);}
.btn-ghost{color:var(--muted); font-size:13px;}
.btn-ghost:hover{color:var(--ink);}
.btn-sm{padding:8px 16px; font-size:13px; border-radius:10px;}
.pill{display:inline-block; padding:5px 14px; border-radius:999px; font-size:11.5px; font-weight:700; letter-spacing:.3px;}
.eyebrow{color:var(--gold); font-size:12.5px; letter-spacing:3px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:10px;}
.eyebrow::before{content:''; width:26px; height:1px; background:var(--gold);}
.section{padding:90px 0;}
.section-head{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:42px; gap:20px; flex-wrap:wrap;}
h1,h2,h3{font-weight:800; line-height:1.25;}
.fade-up{opacity:0; transform:translateY(34px); transition:opacity .8s ease, transform .8s ease;}
.fade-up.in{opacity:1; transform:translateY(0);}
.divider-gold{height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:16px 0;}
.badge-count{position:absolute; top:-6px; left:-6px; background:var(--green); color:#04220f; font-size:10px; font-weight:800; min-width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 2px var(--bg);}
.toast-wrap{position:fixed; top:20px; left:20px; z-index:9999; display:flex; flex-direction:column; gap:10px;}
.toast{background:var(--panel2); border:1px solid var(--gold); border-radius:12px; padding:14px 18px; min-width:260px; box-shadow:0 10px 30px rgba(0,0,0,.5); animation:slideIn .35s ease;}
.toast b{color:var(--gold-l);}
@keyframes slideIn{from{opacity:0; transform:translateX(-30px);} to{opacity:1; transform:translateX(0);}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(47,209,112,.55);} 50%{box-shadow:0 0 0 10px rgba(47,209,112,0);}}
@keyframes pulseGold{0%,100%{box-shadow:0 0 0 0 rgba(212,175,55,.55);} 50%{box-shadow:0 0 0 10px rgba(212,175,55,0);}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0);} 50%{transform:translateY(-18px) rotate(3deg);}}
@keyframes shimmer{0%{background-position:-200% 0;} 100%{background-position:200% 0;}}
@keyframes spin{to{transform:rotate(360deg);}}
.spark{position:absolute; border-radius:50%; background:var(--gold-l); opacity:.7; filter:blur(1px); animation:floaty 6s ease-in-out infinite;}

/* ---------- announcement + header ---------- */
.announce{background:linear-gradient(90deg,var(--green-d),var(--green),var(--green-d)); text-align:center; font-size:13px; font-weight:700; padding:9px 12px; color:#eafff0; letter-spacing:.3px;}
header{position:sticky; top:0; z-index:500; backdrop-filter:blur(14px); background:rgba(7,8,10,.82); border-bottom:1px solid var(--line);}
.headbar{display:flex; align-items:center; justify-content:space-between; padding:14px 0;}
.logo{display:flex; align-items:center; gap:10px; font-weight:800; font-size:20px;}
.logo img{width:42px; height:42px; border-radius:50%; box-shadow:0 0 18px rgba(168,132,42,.45); filter:brightness(.82) saturate(1.05);}
.spin-logo{animation:spin 3.5s linear infinite;}
.logo .sub{font-size:10px; color:var(--muted); letter-spacing:2px; display:block; font-family:'Cinzel',serif;}
nav.mainnav{display:flex; gap:30px; align-items:center;}
nav.mainnav a{font-size:14.5px; font-weight:600; color:var(--muted); position:relative; padding:6px 0;}
nav.mainnav a.active,nav.mainnav a:hover{color:var(--gold-l);}
nav.mainnav a.active::after{content:''; position:absolute; bottom:-4px; right:0; left:0; height:2px; background:var(--gold);}
.head-icons{display:flex; gap:20px; align-items:center;}
.icon-btn{position:relative; width:40px; height:40px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:var(--panel); border:1px solid var(--line); font-size:17px; transition:.2s;}
.icon-btn:hover{border-color:var(--gold);}
.burger{display:none;}
.mobile-menu{display:flex; flex-direction:column; gap:2px; padding:10px 24px 16px; border-top:1px solid var(--line); background:rgba(7,8,10,.96);}
.mobile-menu a{padding:12px 6px; font-size:14.5px; font-weight:600; color:var(--muted); border-bottom:1px solid var(--line);}
.mobile-menu a.active,.mobile-menu a:hover{color:var(--gold-l);}

/* ---------- hero ---------- */
.hero{position:relative; min-height:640px; display:flex; align-items:center; overflow:hidden; border-bottom:1px solid var(--line);}
.hero-bg{position:absolute; inset:0; z-index:0;}
.hero-bg img{width:100%; height:100%; object-fit:cover; opacity:.55; transform:scale(1.04);}
.hero-bg::after{content:''; position:absolute; inset:0; background:linear-gradient(90deg,rgba(7,8,10,.97) 20%,rgba(7,8,10,.55) 60%,rgba(7,8,10,.85) 100%);}
.hero-content{position:relative; z-index:2; max-width:620px; padding:60px 0;}
.hero-content h1{font-size:52px; margin-bottom:18px; position:relative; display:inline-block; padding:6px 18px; border:1px solid var(--gold-d); border-radius:14px; box-shadow:0 0 0 1px rgba(212,175,55,.08) inset, 0 8px 30px rgba(0,0,0,.35);}
.hero-content h1 .gold-txt{background:linear-gradient(120deg,var(--green-l),var(--gold-l),var(--green-l)); background-size:250% auto; -webkit-background-clip:text; background-clip:text; color:transparent; animation:shimmer 4.5s linear infinite;}
.hero-content p{color:var(--muted); font-size:16.5px; line-height:2; margin-bottom:30px; max-width:520px;}
.hero-cta{display:flex; gap:16px; flex-wrap:wrap;}
.hero-dec{position:absolute; z-index:1; inset:0; pointer-events:none;}

/* ---------- categories ---------- */
.cat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:26px; justify-items:center;}
.cat-card{display:flex; flex-direction:column; align-items:center; gap:12px; width:100%; max-width:140px; text-align:center; transition:.3s;}
.cat-card:hover{transform:translateY(-4px);}
.cat-circle{width:120px; height:120px; border-radius:50%; border:1px solid var(--line); background:var(--panel); display:flex; align-items:center; justify-content:center; transition:.3s; flex-shrink:0; position:relative;}
.cat-circle::before{content:''; position:absolute; inset:-6px; border-radius:50%; padding:3px; background:conic-gradient(from 0deg, #000000, #d4af37, #000000 60%, #000000cc); -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; animation:catRingSpin 4s linear infinite; z-index:0;}
@keyframes catRingSpin{to{transform:rotate(360deg);}}
.cat-card:hover .cat-circle{border-color:var(--gold); box-shadow:var(--shadow-gold);}
.cat-circle img{width:100%; height:100%; object-fit:cover; border-radius:50%; position:relative; z-index:1;}
.cat-circle .ic{font-size:42px; position:relative; z-index:1;}
.cat-card b{font-size:13.5px; font-weight:600; line-height:1.3;}

/* ---------- products ---------- */
.prod-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:22px;}
.prod-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; transition:.3s; position:relative; display:flex; flex-direction:column;}
.prod-card:hover{transform:translateY(-8px); border-color:var(--gold); box-shadow:0 18px 40px rgba(0,0,0,.5), var(--shadow-gold);}
.prod-img{aspect-ratio:1/1; overflow:hidden; position:relative; background:#0a0b08;}
.prod-img img{width:100%; height:100%; object-fit:cover; transition:.5s;}
.prod-card:hover .prod-img img{transform:scale(1.08);}
.prod-badge{position:absolute; top:12px; right:12px; z-index:2;}
.prod-fav{position:absolute; top:12px; left:12px; width:34px; height:34px; border-radius:50%; background:rgba(7,8,10,.6); display:flex; align-items:center; justify-content:center; z-index:2; backdrop-filter:blur(4px);}
.prod-body{padding:16px 18px 18px; display:flex; flex-direction:column; gap:8px; flex:1;}
.prod-cat{font-size:11px; color:var(--gold); letter-spacing:1px;}
.prod-name{font-size:15.5px; font-weight:700;}
.prod-desc{font-size:12.5px; color:var(--muted); line-height:1.7; flex:1;}
.prod-foot{display:flex; align-items:center; justify-content:space-between; margin-top:8px;}
.price{font-weight:800; color:var(--gold-l); font-size:15px;}
.price .old{color:var(--muted); text-decoration:line-through; font-weight:400; font-size:12px; margin-right:6px;}
.add-btn{width:38px; height:38px; border-radius:50%; background:var(--gold); color:#1a1305; display:flex; align-items:center; justify-content:center; font-size:18px; transition:.2s;}
.add-btn:hover{transform:scale(1.1) rotate(90deg); box-shadow:0 0 16px rgba(212,175,55,.6);}

/* ---------- trust strip ---------- */
.trust-strip{display:grid; grid-template-columns:repeat(4,1fr); gap:20px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:30px;}
.trust-item{display:flex; gap:14px; align-items:center;}
.trust-item .ic{width:46px; height:46px; border-radius:50%; background:rgba(212,175,55,.12); border:1px solid var(--gold-d); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0;}
.trust-item b{font-size:14px; display:block;} .trust-item span{font-size:12px; color:var(--muted);}

/* ---------- promo ---------- */
.promo{position:relative; border-radius:24px; overflow:hidden; padding:50px; display:flex; justify-content:space-between; align-items:center; background:linear-gradient(120deg,var(--panel2),var(--bg2)); border:1px solid var(--gold-d); flex-wrap:wrap; gap:24px;}
.promo::before{content:''; position:absolute; width:340px; height:340px; background:radial-gradient(circle,rgba(212,175,55,.18),transparent 70%); top:-100px; left:-100px; animation:floaty 8s ease-in-out infinite;}
.countdown{display:flex; gap:10px;}
.cd-box{background:var(--bg); border:1px solid var(--gold-d); border-radius:12px; width:64px; height:64px; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.cd-box b{font-size:22px; color:var(--gold-l);} .cd-box span{font-size:10px; color:var(--muted);}

/* ---------- footer ---------- */
footer{background:linear-gradient(180deg,var(--bg2),#050604); border-top:1px solid var(--line); padding:70px 0 24px; position:relative; overflow:hidden;}
.foot-grid{display:grid; grid-template-columns:1.4fr 1fr 1fr 1.3fr; gap:40px; margin-bottom:50px;}
.foot-grid h4{color:var(--gold-l); font-size:15px; margin-bottom:18px;}
.foot-grid ul{list-style:none;} .foot-grid li{margin-bottom:11px;}
.foot-grid a{color:var(--muted); font-size:13.5px; transition:.2s;} .foot-grid a:hover{color:var(--gold-l); padding-right:4px;}
.foot-social{display:flex; gap:10px; margin-top:16px;}
.foot-social a{width:36px; height:36px; border-radius:50%; border:1px solid var(--line); display:flex; align-items:center; justify-content:center;}
.foot-social a:hover{border-color:var(--gold); color:var(--gold-l);}
.newsletter-row{display:flex; gap:0; margin-top:10px;}
.newsletter-row input{border-radius:10px 0 0 10px; flex:1; border-left:none;}
.newsletter-row button{background:var(--gold); color:#1a1305; padding:0 18px; border-radius:0 10px 10px 0; font-weight:700;}
.foot-bottom{border-top:1px solid var(--line); padding-top:22px; display:flex; justify-content:space-between; color:var(--muted); font-size:12.5px; flex-wrap:wrap; gap:10px;}

/* ---------- floating chat ---------- */
.chat-fab{position:fixed; bottom:26px; left:26px; z-index:800; width:64px; height:64px; border-radius:50%; background:linear-gradient(145deg,var(--gold-l),var(--gold) 55%,var(--gold-d)); display:flex; align-items:center; justify-content:center; font-size:26px; box-shadow:0 10px 34px rgba(212,175,55,.55), 0 0 0 3px rgba(243,216,120,.18); animation:pulseGold 2.4s infinite;}
.chat-fab #chatFabIcon{display:flex; align-items:center; justify-content:center; width:100%; height:100%;}
.chat-fab #chatFabIcon svg{width:28px; height:28px;}
.chat-fab-badge{position:absolute; top:-2px; left:-2px; width:16px; height:16px; border-radius:50%; background:linear-gradient(135deg,#3ee87f,#0a6e30); box-shadow:0 0 0 3px var(--bg), 0 2px 6px rgba(0,0,0,.4);}
.chat-panel{position:fixed; bottom:100px; left:26px; z-index:800; width:360px; max-width:92vw; height:480px; background:var(--panel2); border:1px solid var(--gold-d); border-radius:18px; display:none; flex-direction:column; overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.6);}
.chat-panel.open{display:flex; animation:slideIn .3s ease;}
.chat-head{background:linear-gradient(90deg,var(--green-d),var(--green)); padding:14px 18px; display:flex; justify-content:space-between; align-items:center;}
.chat-head b{font-size:14.5px;} .chat-head span{font-size:11px; opacity:.85;}
.chat-body{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px;}
.msg{max-width:80%; padding:10px 14px; border-radius:14px; font-size:13px; line-height:1.7;}
.msg.bot{background:var(--panel); align-self:flex-start; border:1px solid var(--line); border-bottom-left-radius:2px;}
.msg.me{background:var(--gold); color:#1a1305; align-self:flex-end; border-bottom-right-radius:2px; font-weight:600;}
.msg img{border-radius:10px; margin-top:6px; max-width:180px;}
.chat-input{display:flex; gap:8px; padding:12px; border-top:1px solid var(--line);}
.chat-input input{flex:1;}
.chat-input .icon-btn{width:38px; height:38px; font-size:15px;}

/* ---------- cart drawer ---------- */
.paymethod-tabs{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
.pm-tab{flex:1; min-width:160px; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--panel); font-size:13px; font-weight:600; color:var(--muted); text-align:center; transition:.2s;}
.pm-tab.active{border-color:var(--gold); color:var(--gold-l); background:rgba(212,175,55,.08);}
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(2px); z-index:900; display:none;}
.overlay.show{display:block;}
.drawer{position:fixed; top:0; left:-420px; width:400px; max-width:90vw; height:100%; background:var(--panel2); z-index:901; transition:.35s; display:flex; flex-direction:column; border-left:1px solid var(--gold-d);}
.drawer.open{left:0;}
.drawer-head{padding:20px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line);}
.drawer-body{flex:1; overflow-y:auto; padding:18px;}
.cart-item{display:flex; gap:12px; margin-bottom:16px; padding-bottom:16px; border-bottom:1px solid var(--line);}
.cart-item img{width:64px; height:64px; border-radius:10px; object-fit:cover;}
.cart-item .qty{display:flex; align-items:center; gap:8px; margin-top:6px;}
.cart-item .qty button{width:24px; height:24px; border:1px solid var(--line); border-radius:6px;}
.drawer-foot{padding:20px; border-top:1px solid var(--line);}

/* ---------- generic page shell ---------- */
.page-hero{padding:50px 0 30px; border-bottom:1px solid var(--line); background:linear-gradient(180deg,var(--panel2),transparent);}
.filters{display:flex; gap:10px; margin-bottom:30px; flex-wrap:wrap;}
.filter-chip{padding:9px 20px; border-radius:999px; border:1px solid var(--line); font-size:13px; font-weight:600; color:var(--muted);}
.filter-chip.active{background:var(--gold); color:#1a1305; border-color:var(--gold);}

/* ---------- checkout ---------- */
.checkout-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:34px; align-items:start;}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:26px; overflow-x:auto;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px;}
.field{margin-bottom:14px;} .field label{display:block; font-size:13px; color:var(--muted); margin-bottom:7px;}
.field input,.field textarea,.field select{width:100%;}
.upload-box{border:2px dashed var(--gold-d); border-radius:14px; padding:26px; text-align:center; cursor:pointer; transition:.2s;}
.upload-box:hover{border-color:var(--gold); background:rgba(212,175,55,.05);}
.upload-preview{max-width:100%; border-radius:12px; margin-top:12px;}
.summary-row{display:flex; justify-content:space-between; font-size:14px; margin-bottom:10px; color:var(--muted);}
.summary-row.total{color:var(--ink); font-weight:800; font-size:17px; border-top:1px solid var(--line); padding-top:14px; margin-top:6px;}

.order-progress{display:flex; gap:10px; flex-wrap:wrap; padding-top:10px; border-top:1px solid var(--line);}
.op-step{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted);}
.op-step .op-dot{width:9px; height:9px; border-radius:50%; background:var(--line); display:inline-block;}
.op-step.active{color:var(--green-l);}
.op-step.active .op-dot{background:var(--green-l); box-shadow:0 0 0 3px rgba(107,127,69,.2);}

/* ---------- admin ---------- */
.admin-shell{display:grid; grid-template-columns:250px 1fr; min-height:100vh;}
.admin-side{background:var(--bg2); border-left:1px solid var(--line); padding:22px 16px; display:flex; flex-direction:column;}
.admin-side .logo{margin-bottom:30px; padding:0 8px;}
.admin-nav a{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:12px; color:var(--muted); font-size:14px; font-weight:600; margin-bottom:4px; position:relative;}
.admin-nav a:hover{background:var(--panel); color:var(--ink);}
.admin-nav a.active{background:linear-gradient(90deg,rgba(212,175,55,.18),transparent); color:var(--gold-l); border-right:3px solid var(--gold);}
.admin-main{padding:26px 32px; overflow-x:hidden;}
.admin-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:28px;}
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-bottom:30px;}
.stat-card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px;}
.stat-card b{font-size:26px; display:block; color:var(--gold-l);} .stat-card span{font-size:12.5px; color:var(--muted);}
table{width:100%; min-width:640px; border-collapse:collapse; font-size:13.5px;}
th,td{padding:12px 10px; text-align:right; border-bottom:1px solid var(--line);}
th{color:var(--muted); font-weight:600; font-size:12px;}
tr:hover td{background:rgba(255,255,255,.02);}
.status-pill{padding:4px 12px; border-radius:999px; font-size:11px; font-weight:700;}
.status-pending{background:rgba(212,175,55,.15); color:var(--gold-l);}
.status-awaiting_telegram{background:rgba(90,150,220,.15); color:#8fc1f5;}
.status-approved{background:rgba(107,127,69,.18); color:var(--green-l);}

/* ---------------- storage helpers ---------------- */
// shared = true  -> Supabase "site_data" table (synced across every visitor + admin)
// shared = false -> this browser's own localStorage (never leaves the device)
async function sget(key, shared){
  if(!shared){
    try{ const v = localStorage.getItem("afz_"+key); return v ? JSON.parse(v) : null; }
    catch(e){ return null; }
  }
  if(!cloudEnabled) return null;
  try{
    const { data, error } = await supabaseClient.from("site_data").select("value").eq("key", key).maybeSingle();
    if(error){ console.warn("supabase read failed", error); return null; }
    return data ? data.value : null;
  }catch(e){ console.warn("supabase read failed", e); return null; }
}
async function sset(key, val, shared){
  if(!shared){
    try{ localStorage.setItem("afz_"+key, JSON.stringify(val)); return true; }catch(e){ return false; }
  }
  if(!cloudEnabled){ toast("اتصال به دیتابیس ابری برقرار نیست — تغییرات فقط روی این مرورگر ذخیره می‌شود"); return false; }
  try{
    const { error } = await supabaseClient.from("site_data").upsert(
      { key, value: val, updated_at: new Date().toISOString() }, { onConflict: "key" }
    );
    if(error){ console.warn("supabase write failed", error); return false; }
    return true;
  }catch(e){ console.warn("supabase write failed", e); return false; }
}
function subscribeRealtime(){
  if(!cloudEnabled) return;
  try{
    supabaseClient.channel("site_data_all")
      .on("postgres_changes", { event:"*", schema:"public", table:"site_data" }, (payload)=>{
        const row = payload.new; if(!row) return;
        if(row.key==="orders"){
          const pend = (row.value||[]).filter(o=>o.status==="pending"||o.status==="awaiting_telegram").length;
          if(IS_ADMIN && pend > lastSeenOrderCount){ toast("رسید بانکی جدیدی برای بررسی دریافت شد", "alert"); beep(); }
          lastSeenOrderCount = pend; STORE.orders = row.value || [];
        }
        if(row.key==="chats") STORE.chats = row.value || {};
        if(row.key==="content"){ STORE.content = row.value || STORE.content; applyFonts(); applySEOTags(); }
        if(row.key==="products") STORE.products = row.value || STORE.products;
        if(row.key==="settings") STORE.settings = row.value || STORE.settings;
        if(row.key==="discountCodes") STORE.discountCodes = row.value || STORE.discountCodes;
        if(row.key==="invoices") STORE.invoices = row.value || STORE.invoices;
        if(row.key==="crmNotes") STORE.crmNotes = row.value || STORE.crmNotes;
        if(row.key==="expenses") STORE.expenses = row.value || STORE.expenses;
        if(route.startsWith("#/admin") && IS_ADMIN) refreshAdmin();
        else if(document.getElementById("chatPanel")?.classList.contains("open")) renderChatBody();
      }).subscribe();
  }catch(e){ console.warn("realtime subscribe failed", e); }
}

/* ---------------- SEO ---------------- */
function setMetaTag(attr, key, content){
  if(!content) return;
  let el = document.head.querySelector(`meta[${attr}="${key}"]`);
  if(!el){ el = document.createElement("meta"); el.setAttribute(attr, key); document.head.appendChild(el); }
  el.setAttribute("content", content);
}
function applySEOTags(){
  const seo = Object.assign({}, DEFAULTS.content.seo, STORE.content.seo || {});
  if(seo.title) document.title = seo.title;
  setMetaTag("name","description", seo.description);
  setMetaTag("name","keywords", seo.keywords);
  setMetaTag("name","robots", seo.robots || "index,follow");
  setMetaTag("property","og:title", seo.title);
  setMetaTag("property","og:description", seo.description);
  setMetaTag("property","og:type", "website");
  if(seo.ogImage) setMetaTag("property","og:image", seo.ogImage);
  if(seo.canonical){
    let link = document.head.querySelector('link[rel="canonical"]');
    if(!link){ link = document.createElement("link"); link.rel="canonical"; document.head.appendChild(link); }
    link.href = seo.canonical;
  }
  if(seo.gscVerification) setMetaTag("name","google-site-verification", seo.gscVerification);
  if(seo.gaId && !document.getElementById("ga-script")){
    const s1 = document.createElement("script");
    s1.id = "ga-script"; s1.async = true; s1.src = "https://www.googletagmanager.com/gtag/js?id="+encodeURIComponent(seo.gaId);
    document.head.appendChild(s1);
    const s2 = document.createElement("script");
    s2.text = `window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js', new Date());gtag('config', '${seo.gaId}');`;
    document.head.appendChild(s2);
  }
}
function fmt(n){ return n.toLocaleString("fa-IR"); }

function toast(msg, kind){
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<b>${kind==='alert'?'🔔 اعلان جدید':'✔ انجام شد'}</b><br>${msg}`;
  document.getElementById("toastWrap").appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition=".4s"; setTimeout(()=>el.remove(),400); }, 4200);
}
function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.08;
    o.start(); o.frequency.exponentialRampToValueAtTime(440, ctx.currentTime+.15);
    o.stop(ctx.currentTime+.2);
  }catch(e){}
}

function addToCart(id){
  const p = STORE.products.find(x=>x.id===id);
  const ex = CART.find(x=>x.id===id);
  if(ex) ex.qty++; else CART.push({id:p.id, name:p.name, price:p.price, img:p.img, qty:1});
  toast(`«${p.name}» به سبد خرید اضافه شد`);
  renderCart(); toggleCart(true);
}
function changeQty(id,d){
  const it = CART.find(x=>x.id===id); if(!it) return;
  it.qty += d; if(it.qty<=0) CART = CART.filter(x=>x.id!==id);
  renderCart();
}
function cartTotal(){ return CART.reduce((a,c)=>a+c.price*c.qty,0); }
function renderCart(){
  const titleEl = document.getElementById("cartDrawerTitle"); if(titleEl) titleEl.textContent = t('cart_title');
  document.getElementById("cartBody").innerHTML = CART.length ? CART.map(it=>`

        <div class="qty">
          <button onclick="changeQty('${it.id}',-1)">−</button><span>${it.qty}</span><button onclick="changeQty('${it.id}',1)">+</button>
          <button class="btn-ghost" style="margin-right:auto;" onclick="changeQty('${it.id}',-99)">حذف</button>
        </div>
      </div>
    </div>`).join('') : `<p style="color:var(--muted); text-align:center; margin-top:60px;">${t('cart_empty')}</p>`;
  document.getElementById("cartFoot").innerHTML = CART.length ? `
    <div class="summary-row total"><span>جمع کل</span><span>${toman(cartTotal())}</span></div>
    <a href="#/checkout" class="btn btn-gold" style="width:100%; justify-content:center; margin-top:14px;" onclick="toggleCart(false)">${t('cart_checkout')}</a>` : '';

// shrink+compress the uploaded receipt photo so it doesn't fail to save (phone photos can be several MB)
function compressImage(dataUrl, maxW){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxW/img.width);
      const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL("image/jpeg", 0.65));
    };
    img.onerror = ()=> resolve(dataUrl);
    img.src = dataUrl;
  });
}
function handleReceipt(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async e=>{
    document.getElementById("uploadInner").innerHTML = `<div class="spinner" style="margin:10px auto;"></div><div style="font-size:12px; color:var(--muted);">در حال پردازش تصویر...</div>`;
    receiptBase64 = await compressImage(e.target.result, 900);
    document.getElementById("uploadInner").innerHTML = `<img src="${receiptBase64}" class="upload-preview"><div style="margin-top:10px; color:var(--green-l); font-size:13px;">✔ رسید آپلود شد — برای تغییر کلیک کنید</div>`;
  };
  reader.readAsDataURL(file);
}
let lastOrderId = null;
let lastOrderTelegramText = null;
async function submitOrder(){
  const name = document.getElementById("ckName").value.trim();
  const phone = document.getElementById("ckPhone").value.trim();
  const addr = document.getElementById("ckAddr").value.trim();
  if(!name||!phone||!addr){ toast("لطفا اطلاعات گیرنده را کامل کنید"); return; }
  if(payMethod==='receipt' && !receiptBase64){ toast("لطفا تصویر رسید بانکی را آپلود کنید"); return; }

  const order = {
    id: "AFZ-" + Date.now().toString().slice(-8),
    sessionId: MY_SESSION,
    customer:{name,phone,addr},
    items: CART.map(i=>({id:i.id,name:i.name,price:i.price,qty:i.qty})),
    subtotal: cartTotal(),
    discountCode: appliedDiscount ? appliedDiscount.code : null,
    discountAmount: discountAmount(),
    total: finalTotal(),
    payMethod: payMethod,
    receiptImg: payMethod==='receipt' ? receiptBase64 : null,
    status: payMethod==='telegram' ? "awaiting_telegram" : "pending",
    createdAt: nowStr(),
    ts: Date.now(),
    invoiceNo: "INV-"+Date.now().toString().slice(-6)
  };

  const btn = document.getElementById("ckSubmitBtn");
  if(btn){ btn.disabled = true; btn.textContent = "در حال ثبت سفارش..."; }

  // re-fetch latest orders right before writing, to avoid overwriting orders from other customers checking out at the same time
  const freshOrders = await sget("orders", true);
  STORE.orders = freshOrders || STORE.orders;
  STORE.orders.push(order);
  await sset("orders", STORE.orders, true);
  // confirm the write actually landed (cloud saves can silently fail — verify instead of assuming success)
  const verify = await sget("orders", true);
  const saved = !cloudEnabled || (verify && verify.some(o=>o.id===order.id));
  if(!saved){
    if(btn){ btn.disabled = false; btn.textContent = payMethod==='telegram' ? "ثبت و ارسال فاکتور در تلگرام" : "ثبت نهایی سفارش"; }
    toast("ثبت سفارش با مشکل مواجه شد — لطفا دوباره تلاش کنید یا از طریق چت با پشتیبانی تماس بگیرید");
    return;
  }

  if(!STORE.chats[MY_SESSION]) STORE.chats[MY_SESSION]=[];
  if(payMethod==='receipt'){
    STORE.chats[MY_SESSION].push({from:"user", text:"📎 رسید واریزی سفارش "+order.id+" ارسال شد.", img:receiptBase64, time:nowStr(), orderRef:order.id});
  } else {
    STORE.chats[MY_SESSION].push({from:"user", text:"📨 سفارش "+order.id+" ثبت شد — فاکتور از طریق تلگرام برای پشتیبانی ارسال می‌شود.", time:nowStr(), orderRef:order.id});
  }
  await sset("chats", STORE.chats, true);

  lastOrderId = order.id;
  lastOrderTelegramText = buildTelegramInvoiceText(order);
  CART = []; receiptBase64 = null; appliedDiscount = null;
  go("#/order-success");
}
function buildTelegramInvoiceText(o){
  const lines = [
    `فاکتور سفارش افضلی‌شاپ`,
    `شماره فاکتور: ${o.invoiceNo}`,
    `کد سفارش: ${o.id}`,
    `مشتری: ${o.customer.name}`,
    `موبایل: ${o.customer.phone}`,
    `آدرس: ${o.customer.addr}`,
    `----------------`,
    ...o.items.map(it=>`${it.name} × ${it.qty} = ${it.price*it.qty} تومان`),
    `----------------`,
    `مبلغ کل: ${o.total} تومان`,
    `لطفا شماره کارت جهت واریز را ارسال کنید 🙏`
  ];
  return lines.join("\n");
}

  if(!lastOrderTelegramText) return;

            return `<div class="op-step ${active?'active':''}"><span class="op-dot"></span><span>${labels[i]}</span></div>`;
          }).join('')}
        </div>
        <div style="text-align:left; margin-top:10px;"><b>${toman(o.total)}</b></div>
      </div>`).join('')}
    </div>`}
  </section>`;
}

function initLoginDrag(){
  const card = document.getElementById("loginCard");
  const handle = document.getElementById("loginDragHandle");
  if(!card || !handle) return;
  let dragging=false, startX=0, startY=0, curX=0, curY=0;
  const onDown = (e)=>{
    dragging = true;
    const p = e.touches ? e.touches[0] : e;
    startX = p.clientX - curX; startY = p.clientY - curY;
  };
  const onMove = (e)=>{
    if(!dragging) return;
    const p = e.touches ? e.touches[0] : e;
    curX = p.clientX - startX; curY = p.clientY - startY;
    card.style.transform = `translate(${curX}px, ${curY}px)`;
  };
  const onUp = ()=>{ dragging = false; };
  handle.addEventListener("mousedown", onDown);
  handle.addEventListener("touchstart", onDown, {passive:true});
  window.addEventListener("mousemove", onMove);
  window.addEventListener("touchmove", onMove, {passive:true});
  window.addEventListener("mouseup", onUp);
  window.addEventListener("touchend", onUp);
}

/* ---------------- SITE BACKUP ---------------- */
function buildBackupPayload(){
  return {
    exportedAt: new Date().toISOString(),
    content: STORE.content, products: STORE.products, orders: STORE.orders, chats: STORE.chats,
    settings: STORE.settings, discountCodes: STORE.discountCodes, invoices: STORE.invoices,
    crmNotes: STORE.crmNotes, expenses: STORE.expenses
  };
}
function downloadBackupFile(){
  const payload = buildBackupPayload();
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `afzalishop-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
async function manualBackup(){
  downloadBackupFile();
  STORE.settings.lastBackupAt = new Date().toISOString();
  await sset("settings", STORE.settings, true);
  toast("بکاپ سایت گرفته شد و دانلود شد ✅");
  refreshAdmin();
}
async function checkAutoBackup(){
  if(!IS_ADMIN) return;
  const last = STORE.settings.lastBackupAt ? new Date(STORE.settings.lastBackupAt) : null;
  const weekMs = 1000*60*60*24*7;
  if(last && (Date.now() - last.getTime()) < weekMs) return;
  // یک هفته از آخرین بکاپ گذشته (یا اصلا بکاپی گرفته نشده) — بکاپ خودکار می‌گیریم و هشدار نشان می‌دهیم
  downloadBackupFile();
  STORE.settings.lastBackupAt = new Date().toISOString();
  await sset("settings", STORE.settings, true);
  toast("⏰ بکاپ خودکار هفتگی سایت گرفته شد و دانلود شد", "alert");
  beep();
  if(route.startsWith("#/admin")) refreshAdmin();
}
function lastBackupLabel(){
  if(!STORE.settings.lastBackupAt) return "هنوز بکاپی گرفته نشده";
  try{ return new Date(STORE.settings.lastBackupAt).toLocaleString("fa-IR"); }catch(e){ return STORE.settings.lastBackupAt; }
}

function gproAnimateNum(el, endVal, decimals, suffix){
  if(!el) return;
  const dur = 900, t0 = performance.now();
  function step(t){
    const p = Math.min(1, (t-t0)/dur);
    const v = endVal*(1-Math.pow(1-p,3));
    el.textContent = v.toLocaleString("fa-IR",{maximumFractionDigits:decimals}) + (suffix||"");
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

const GPRO_PALETTE = ['#d4af37','#6b7f45','#a8842a','#8896ab','#e05555','#34d399','#f59e0b','#4a5d32'];
function gproHasOrders(){ return STORE.orders.length>0; }
function gproHasItems(){ return STORE.orders.some(o=>(o.items||[]).length>0); }
function gproDailySeries(days){
  const today = new Date(); today.setHours(0,0,0,0);
  const labels=[], keys=[], map={};
  for(let i=days-1;i>=0;i--){
    const d = new Date(today.getTime()-i*86400000);
    const key = d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
    keys.push(key);
    labels.push(d.toLocaleDateString('fa-IR',{month:'2-digit',day:'2-digit'}));
    map[key] = {revenue:0,count:0};
  }
  STORE.orders.forEach(o=>{
    if(!o.ts) return; // orders saved before this field existed can't be placed on the timeline
    const d = new Date(o.ts); d.setHours(0,0,0,0);
    const key = d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
    if(map[key]){ map[key].revenue += (o.total||0); map[key].count += 1; }
  });
  return {
    labels,
    revenue: keys.map(k=>map[k].revenue),
    count: keys.map(k=>map[k].count),
    avg: keys.map(k=>map[k].count ? Math.round(map[k].revenue/map[k].count) : 0)
  };
}
function gproProdIndex(){ const m={}; STORE.products.forEach(p=>m[p.id]=p); return m; }
function gproCategoryRevenue(){

  STORE.orders.forEach(o=>(o.items||[]).forEach(it=>{

    map[cat] = (map[cat]||0) + (it.price||0)*(it.qty||1);

  return map;
}
function gproCategoryQty(){

async function saveContent(silent){
  // keep every field already on STORE.content (logo, banners, fonts, chatIcon, etc.)
  // and only overwrite the ones this form actually edits — previously this rebuilt
  // the whole object from scratch, silently dropping any field not in this form.
  STORE.content = {
    ...STORE.content,
    heroTitle: document.getElementById("cfHero").value,
    heroSubtitle: document.getElementById("cfSub").value,
    announceText: document.getElementById("cfAnn").value,
    chatWelcome: document.getElementById("cfChat").value,
    aboutText: document.getElementById("cfAbout").value,
    promoTitle: document.getElementById("cfPromoT").value,
    promoDesc: document.getElementById("cfPromoD").value,
    freeShipCity: document.getElementById("cfCity").value
  };
  const ok = await sset("content", STORE.content, true);
  if(!ok){
    toast("ذخیره انجام نشد — اتصال ابری برقرار نیست، پس از اتصال دوباره تلاش کنید", "alert");
    return;
  }
  // verify the write actually landed in the cloud instead of assuming success,
  // so the 4-second poll loop below can't silently revert this edit
  const verify = await sget("content", true);
  const verified = !cloudEnabled || (verify && JSON.stringify(verify)===JSON.stringify(STORE.content));
  if(!silent){
    if(verified) toast("محتوای سایت به‌روزرسانی شد");
    else toast("ذخیره تایید نشد، لطفا دوباره تلاش کنید", "alert");
  } else if(!verified){
    toast("ذخیره خودکار تایید نشد، لطفا دوباره تلاش کنید", "alert");
  }
  applyFonts();
  applySEOTags();
  renderChatFabIcon();
}

  if(!adminChatOpen && sessions.length) adminChatOpen = sessions[sessions.length-1];
  const relatedOrder = adminChatOpen ? STORE.orders.filter(o=>o.sessionId===adminChatOpen).sort((a,b)=>b.createdAt.localeCompare(a.createdAt))[0] : null;
  const pendingReceipt = relatedOrder && relatedOrder.status==='pending' ? relatedOrder : null;
  return `<div class="chat-inbox">
    <div class="inbox-list">
      ${sessions.length ? sessions.slice().reverse().map(s=>{
        const msgs = STORE.chats[s]; const last = msgs[msgs.length-1];
        const hasPending = STORE.orders.some(o=>o.sessionId===s && o.status==='pending');
        return `<div class="inbox-item ${adminChatOpen===s?'active':''}" onclick="openChatSession('${s}')">
          <b>مشتری ${s.slice(-5)} ${hasPending?'🔴':''}</b>

      }).join('') : `<div style="padding:20px; color:var(--muted); font-size:13px;">هنوز گفتگویی ثبت نشده</div>`}
    </div>
    <div class="admin-chat-thread">
      ${adminChatOpen ? `
      ${pendingReceipt ? `<div class="receipt-pin">
        <img src="${pendingReceipt.receiptImg}" onclick="showOrderReceipt('${pendingReceipt.id}')">

          <b style="font-size:13px;">رسید سفارش ${pendingReceipt.id} در انتظار تایید</b>

        ${STORE.chats[adminChatOpen].map(m=>`<div class="msg ${m.from==='admin'?'me':'bot'}" style="align-self:${m.from==='admin'?'flex-end':'flex-start'};">${m.text}${m.img?`<img src="${m.img}" style="cursor:pointer;" onclick="showLightbox('${m.img}')">`:''}</div>`).join('')}
      </div>
      <div class="chat-input" style="border:1px solid var(--line); border-radius:12px;">
        <input type="text" id="adminChatText" placeholder="پاسخ به مشتری...">
        <button class="icon-btn" style="background:var(--green);" onclick="adminSendChat()">➤</button>
      </div>` : `<div style="margin:auto; color:var(--muted);">گفتگویی برای نمایش انتخاب نشده است</div>`}
    </div>
  </div>`;
}
function openChatSession(s){ adminChatOpen = s; refreshAdmin(); }
async function adminSendChat(){
  const inp = document.getElementById("adminChatText"); const text = inp.value.trim(); if(!text||!adminChatOpen) return;
  STORE.chats[adminChatOpen].push({from:"admin", text, time:nowStr()});
  await sset("chats", STORE.chats, true);
  inp.value=""; refreshAdmin();
}

function adminSettings(){
  const s = STORE.settings;
  return `
  <div class="card" style="max-width:520px; margin-bottom:18px;">
    <h3 style="margin-bottom:14px;">اطلاعات پرداخت کارت‌به‌کارت</h3>
    <div class="field"><label>شماره کارت</label><input id="stCardNum" value="${s.cardNumber}"></div>
    <div class="field"><label>نام صاحب حساب</label><input id="stCardHolder" value="${s.cardHolder}"></div>
    <div class="field"><label>آیدی تلگرام پشتیبانی (بدون @)</label><input id="stTelegram" value="${s.telegramUsername}"></div>
    <button class="btn btn-gold btn-sm" onclick="savePaymentSettings()">ذخیره اطلاعات پرداخت</button>
  </div>
  <div class="card" style="max-width:520px; margin-bottom:18px;">
    <h3 style="margin-bottom:14px;">لوگوی سربرگ فاکتور</h3>
    <div style="display:flex; align-items:center; gap:14px; margin-bottom:12px;">
      <img src="${s.invoiceLogo}" style="width:56px; height:56px; border-radius:12px; object-fit:cover; border:1px solid var(--line);">
      <button class="btn btn-outline btn-sm" onclick="document.getElementById('invLogoInput').click()">تغییر لوگو</button>
      <input type="file" id="invLogoInput" accept="image/*" class="hide" onchange="handleInvoiceLogo(this)">
    </div>
    <p style="font-size:12px; color:var(--muted);">این لوگو در بالای فاکتورهایی که برای مشتری چاپ می‌شود نمایش داده می‌شود.</p>
  </div>
  <div class="card" style="max-width:440px;">
    <h3 style="margin-bottom:14px;">ورود مدیر</h3>
    <div class="field"><label>نام کاربری مدیر</label><input id="stUser" value="${STORE.settings.adminUser}"></div>
    <div class="field"><label>رمز عبور جدید</label><input id="stPass" type="password" placeholder="رمز جدید را وارد کنید" value="${STORE.settings.adminPass}"></div>
    <button class="btn btn-gold" onclick="saveSettings()">ذخیره تنظیمات</button>
  </div>`;
}
async function savePaymentSettings(){
  STORE.settings.cardNumber = document.getElementById("stCardNum").value.trim() || STORE.settings.cardNumber;
  STORE.settings.cardHolder = document.getElementById("stCardHolder").value.trim() || STORE.settings.cardHolder;
  STORE.settings.telegramUsername = document.getElementById("stTelegram").value.trim().replace(/^@/,"") || STORE.settings.telegramUsername;
  await sset("settings", STORE.settings, true);
  toast("اطلاعات پرداخت ذخیره شد");
}
function handleInvoiceLogo(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async e=>{
    STORE.settings.invoiceLogo = await compressImage(e.target.result, 240);
    await sset("settings", STORE.settings, true);
    toast("لوگوی فاکتور به‌روزرسانی شد");
    refreshAdmin();
  };
  reader.readAsDataURL(file);
}
async function saveSettings(){
  STORE.settings.adminUser = document.getElementById("stUser").value.trim() || STORE.settings.adminUser;
  STORE.settings.adminPass = document.getElementById("stPass").value.trim() || STORE.settings.adminPass;
  await sset("settings", STORE.settings, true);
  toast("تنظیمات ذخیره شد");
}

/* ---------------- misc ui ---------------- */
function toggleMobileNav(){
  const m = document.getElementById("mobileMenu");
  if(m) m.classList.toggle("hide");
}
const DEFAULT_CHAT_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="#1a1305" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>`;
function renderChatFabIcon(){
  const el = document.getElementById("chatFabIcon"); if(!el) return;
  const icon = STORE.content.chatIcon || "";
  const looksLikeImage = /^(assets\/|https?:\/\/|data:image)/.test(icon);
  if(looksLikeImage){
    el.innerHTML = `<img src="${icon}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;" onerror="this.parentNode.innerHTML='${DEFAULT_CHAT_ICON_SVG.replace(/'/g,"\\'")}';">`;
  } else if(icon){
    el.innerHTML = `<span style="font-size:26px;line-height:1;">${icon}</span>`;
  } else {
    el.innerHTML = DEFAULT_CHAT_ICON_SVG;
  }
}
function afterRender(){
  renderChatFabIcon();
  renderCart();
  initLoginDrag();
  const cartBtn = document.getElementById("headerCartBtn");
  if(cartBtn) cartBtn.onclick = ()=>toggleCart(true);
  document.getElementById("chatFab").onclick = ()=>toggleChat(!document.getElementById("chatPanel").classList.contains("open"));
  if(route.startsWith("#/") && !route.startsWith("#/admin")) renderChatBody();
  // countdown
  const cdBox = document.getElementById("countdownBox");
  if(cdBox){
    const end = Date.now() + 1000*60*60*24*2 + 1000*60*60*18;
    const upd = ()=>{
      const diff = Math.max(0, end-Date.now());
      const d=Math.floor(diff/86400000), h=Math.floor(diff/3600000)%24, m=Math.floor(diff/60000)%60, s=Math.floor(diff/1000)%60;
      cdBox.innerHTML = [[d,'روز'],[h,'ساعت'],[m,'دقیقه'],[s,'ثانیه']].map(([v,l])=>`<div class="cd-box"><b>${String(v).padStart(2,'0')}</b><span>${l}</span></div>`).join('');
    };
    upd(); clearInterval(window._cdInt); window._cdInt = setInterval(upd,1000);
  }
  // scroll reveal
  const obs = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('in'); }), {threshold:.15});
  document.querySelectorAll('.fade-up').forEach(el=>obs.observe(el));
  // banner carousel motion
  const carousel = document.getElementById("bannerCarousel");
  clearInterval(window._bannerInt);
  if(carousel){
    const slides = carousel.querySelectorAll(".banner-slide");
    if(slides.length>1){
      window._bannerInt = setInterval(()=>{ gotoBanner((currentBannerIdx()+1)%slides.length); }, 5000);
    }
  }
}
function currentBannerIdx(){
  const active = document.querySelector(".banner-slide.active");
  return active ? Number(active.dataset.i) : 0;
}
function gotoBanner(i){
  document.querySelectorAll(".banner-slide").forEach(el=>el.classList.toggle("active", Number(el.dataset.i)===i));
  document.querySelectorAll(".banner-dots button").forEach((el,idx)=>el.classList.toggle("active", idx===i));
}

/* ---------------- polling for realtime-ish sync ---------------- */
async function pollUpdates(){
  const [orders, chats, content, products] = await Promise.all([
    sget("orders", true), sget("chats", true), sget("content", true), sget("products", true)
  ]);
  if(orders){
    const pend = orders.filter(o=>o.status==='pending'||o.status==='awaiting_telegram').length;
    if(IS_ADMIN && pend > lastSeenOrderCount){
      toast("رسید بانکی جدیدی برای بررسی دریافت شد", "alert"); beep();
    }
    lastSeenOrderCount = pend;
    STORE.orders = orders;
  }
  if(chats){
    const sig = JSON.stringify(Object.values(chats).map(m=>m.length));
    if(IS_ADMIN && sig !== lastSeenChatSig && lastSeenChatSig!==""){
      // detect new user message
    }
    lastSeenChatSig = sig;
    STORE.chats = chats;
  }
  if(content) STORE.content = content;
  if(products) STORE.products = products;
  // live-refresh visible parts without full reflow jank
  if(route.startsWith("#/admin") && IS_ADMIN){
    // BUGFIX: refreshAdmin() replaces the innerHTML of #adminContent, which used to
    // run every 4s even while the admin was mid-keystroke in a field — that wiped the
    // input and threw focus/the mobile keyboard away. Now we skip the refresh entirely
    // while an input/textarea/select inside the admin content area is focused.
    if(!isEditingAdminForm()) refreshAdmin();
    checkAutoBackup();
  }
  else if(document.getElementById("chatPanel")?.classList.contains("open")) renderChatBody();
}
function isEditingAdminForm(){
  const el = document.activeElement;
  if(!el) return false;
  const tag = el.tagName;
  if(tag!=="INPUT" && tag!=="TEXTAREA" && tag!=="SELECT") return false;
  const box = document.getElementById("adminContent");
  return !!(box && box.contains(el));
}
setInterval(pollUpdates, 4000);

/* ---------------- init ---------------- */
(async function init(){
  await loadAll();
  subscribeRealtime();
  route = location.hash || "#/";
  await render();
  checkAutoBackup();
})();
</script>
